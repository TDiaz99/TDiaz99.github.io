{%- if page.full_title -%}
  {%- assign page_title = page.full_title -%}
{%- else -%}
  {%- assign page_title = page.title | append: " — " | append: site.title -%}
{%- endif -%}
{%- assign page_description = page.description | default: site.description -%}
		<title>{{ page_title }}</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="{{ page_description | strip_newlines | escape }}" />

		<!-- Whole site is kept out of search results; see robots.txt -->
		<meta name="robots" content="noindex, nofollow" />
		<link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}" />

		<!-- Link previews (LinkedIn, Slack, email clients) -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="{{ site.title }}" />
		<meta property="og:title" content="{{ page_title | escape }}" />
		<meta property="og:description" content="{{ page_description | strip_newlines | escape }}" />
		<meta property="og:url" content="{{ page.url | replace: 'index.html', '' | absolute_url }}" />

		<link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}" />
		<link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}" />
		<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
		<link rel="stylesheet" href="{{ '/assets/css/reveal-email.css' | relative_url }}" />
